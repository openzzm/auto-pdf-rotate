<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 页面方向自动修正</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section class="hero">
      <span class="eyebrow">LOCAL PDF TOOL</span>
      <h1>PDF 页面方向<br><em>自动修正</em></h1>
      <p>上传扫描 PDF，系统自动识别横倒、上下颠倒页面，并生成修正后的文件。文件仅在本机处理。</p>
    </section>

    <section class="panel">
      <div id="startupLoading" class="startup-loading">
        <span class="spinner" aria-hidden="true"></span>
        <strong>正在初始化本地处理引擎</strong>
        <small>正在准备 OCR 与文件选择器，请稍候</small>
      </div>

      <button id="selectFile" class="dropzone" type="button" disabled>
        <span class="icon">PDF</span>
        <strong id="fileName">点击或拖拽 PDF 文件</strong>
        <small>处理完成后自动保存到源文件同目录</small>
      </button>

      <div id="progressBox" class="progress-box hidden">
        <div class="progress-head">
          <strong id="message">准备处理</strong>
          <span id="percent">0%</span>
        </div>
        <div class="track"><div id="bar"></div></div>
        <div class="time-stats">
          <div><small>已用时间</small><strong id="elapsed">00:00</strong></div>
          <div><small>平均每页</small><strong id="average">--</strong></div>
          <div><small>预计剩余</small><strong id="eta">计算中</strong></div>
        </div>
      </div>

      <div id="result" class="result hidden">
        <span class="check">✓</span>
        <div>
          <strong>处理完成</strong>
          <p id="summary"></p>
        </div>
        <p id="savedPath"></p>
      </div>
      <p id="error" class="error hidden"></p>
    </section>
  </main>
  <footer>使用自适应轻量方向检测；正常页面只分析一次，方向不明确的页面会保持原样。</footer>
  <script src="/static/app.js"></script>
</body>
</html>
